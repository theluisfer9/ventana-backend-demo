services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: ventana_magica_keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    restart: unless-stopped
